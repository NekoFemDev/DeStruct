name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: build, vet, test, smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone-dev

      - name: Build
        run: |
          make build || {
            echo "make build failed; falling back to go build"
            go build ./...
            go build -o destruct ./cmd/destruct
          }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Smoke test (hex editor, read-only, on ARM64 ELF fixture)
        run: ./destruct hex ./test/liblun.so --read-only -c "info"
